# Fails any pull request that skips a level of the branch flow.
# feature/* → dev → uat → release (production) → main (stable record)
# hotfix/* → release; release → uat/dev back-merges after a hotfix.
# See docs/BRANCHING.md. Make "branch-flow" a required status check.
name: branch-flow

on:
  pull_request:
    branches: [dev, uat, release, main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  branch-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check source and target branches
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "PR: $HEAD → $BASE"
          ok=false
          case "$BASE" in
            dev)
              case "$HEAD" in
                feature/*|fix/*|docs/*|chore/*|test/*|refactor/*|ci/*|dependabot/*|release) ok=true ;;
              esac ;;
            uat)
              case "$HEAD" in dev|release) ok=true ;; esac ;;
            release)
              case "$HEAD" in uat|hotfix/*) ok=true ;; esac ;;
            main)
              case "$HEAD" in release) ok=true ;; esac ;;
          esac
          if [ "$ok" != true ]; then
            echo "::error::'$HEAD' can't merge into '$BASE'. Allowed: feature|fix|docs|chore|test|refactor|ci/* → dev, dev → uat, uat|hotfix/* → release, release → main, release → uat|dev (back-merge). See docs/BRANCHING.md."
            exit 1
          fi
          echo "Allowed."
